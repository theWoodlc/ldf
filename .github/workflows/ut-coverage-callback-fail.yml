name: UT Coverage Callback Fail

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Upload with unreachable callback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare coverage report
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          coverage run -m pytest -q
          coverage json

      - name: Upload UT coverage
        uses: openlibing-test/upload-ut-action@v1.0.2
        env:
          OPENLIBING_APIG_BETA_BASE: https://invalid-callback.example.invalid
        with:
          report_path: ./coverage.json
          env_type: beta
