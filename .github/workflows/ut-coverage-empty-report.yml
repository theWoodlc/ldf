name: UT Coverage Empty Report

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Upload with no report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload UT coverage
        uses: openlibing-test/upload-ut-action@v1.0.2
        with:
          report_path: ./not-exist-dir
          env_type: beta
